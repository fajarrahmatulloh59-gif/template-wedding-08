<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none" stroke="#76563E" stroke-linecap="round" stroke-linejoin="round">
  <!-- Traditional Sundanese Vernacular Architecture (Julang Ngapak / Imah Panggung) -->
  <!-- Extended wing ridge (Ngapak) -->
  <path d="M10 40 C30 25 65 15 80 15 C95 15 130 25 150 40" stroke-width="2" stroke="#B69A62"/>
  <path d="M18 45 L80 22 L142 45" stroke-width="1.5" stroke="#76563E"/>
  
  <!-- Crest ornaments (Cagak Gunting) -->
  <path d="M74 25 L86 10" stroke-width="1.8" stroke="#B69A62"/>
  <path d="M86 25 L74 10" stroke-width="1.8" stroke="#B69A62"/>
  
  <!-- Wooden body & stilts (Panggung) -->
  <rect x="42" y="44" width="76" height="32" rx="2" stroke-width="1.5" fill="#FAF7F0" fill-opacity="0.3"/>
  <line x1="80" y1="44" x2="80" y2="76" stroke-width="1"/>
  <!-- Door / Window wooden lattice -->
  <rect x="52" y="52" width="16" height="24" stroke-width="1" stroke="#B69A62"/>
  <rect x="92" y="52" width="16" height="24" stroke-width="1" stroke="#B69A62"/>
  
  <!-- Stilts / Pillars -->
  <line x1="46" y1="76" x2="46" y2="92" stroke-width="2"/>
  <line x1="80" y1="76" x2="80" y2="92" stroke-width="2"/>
  <line x1="114" y1="76" x2="114" y2="92" stroke-width="2"/>
  <line x1="38" y1="92" x2="122" y2="92" stroke-width="1.5" stroke="#71806A"/>
</svg>
