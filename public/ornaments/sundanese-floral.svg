<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#B69A62" stroke-linecap="round" stroke-linejoin="round">
  <!-- Central Floral Jasmine / Padma Rosette -->
  <circle cx="50" cy="50" r="7" fill="#B69A62" fill-opacity="0.3" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="2.5" fill="#B69A62"/>
  <!-- Petals 8-fold symmetric -->
  <path d="M50 43 C46 32 54 32 50 43" stroke-width="1.3" fill="#B69A62" fill-opacity="0.12"/>
  <path d="M50 57 C46 68 54 68 50 57" stroke-width="1.3" fill="#B69A62" fill-opacity="0.12"/>
  <path d="M43 50 C32 46 32 54 43 50" stroke-width="1.3" fill="#B69A62" fill-opacity="0.12"/>
  <path d="M57 50 C68 46 68 54 57 50" stroke-width="1.3" fill="#B69A62" fill-opacity="0.12"/>
  <!-- Diagonal Petals -->
  <path d="M45 45 C38 38 42 34 45 45" stroke-width="1.2" fill="#B69A62" fill-opacity="0.1"/>
  <path d="M55 45 C62 38 58 34 55 45" stroke-width="1.2" fill="#B69A62" fill-opacity="0.1"/>
  <path d="M45 55 C38 62 42 66 45 55" stroke-width="1.2" fill="#B69A62" fill-opacity="0.1"/>
  <path d="M55 55 C62 62 58 66 55 55" stroke-width="1.2" fill="#B69A62" fill-opacity="0.1"/>
  <!-- Outer delicate circle -->
  <circle cx="50" cy="50" r="32" stroke-width="0.8" stroke-dasharray="2 3"/>
</svg>
